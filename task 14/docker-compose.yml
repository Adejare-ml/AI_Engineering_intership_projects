version: '3.8'

services:
  # 1. FastAPI Caching Backend
  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    depends_on:
      - redis-cache

  # 2. Spring Boot Gateway Proxy
  springboot-gateway:
    build:
      context: ../task 13
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - fastapi.url=http://fastapi-backend:8000/api/chat
    depends_on:
      - fastapi-backend

  # 3. Redis Cache Database
  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
